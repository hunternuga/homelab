name: Deploy Homelab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deploys — queue rather than cancel
concurrency:
  group: homelab-deploy
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Copies whichever tfvars already exist on the runner — a service
      # without secrets yet (e.g. collection-tracker, pre-deploy) just fails
      # its own terraform step later instead of blocking every other
      # service's deploy here.
      - name: Restore secrets
        run: |
          for svc in cloudflared collection-tracker minepanel; do
            if [ -f ~/.homelab-secrets/$svc.tfvars ]; then
              cp ~/.homelab-secrets/$svc.tfvars services/$svc/terraform.tfvars
            fi
          done

      - name: Plan
        run: ./deploy.sh plan

  deploy:
    name: Deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Uses podman directly rather than `docker` — the runner only has the
      # `docker` shell alias from interactive profiles, which non-interactive
      # `run:` steps don't source.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push collection-tracker image
        run: |
          podman build -t ghcr.io/hunternuga/collection-tracker:latest -t "ghcr.io/hunternuga/collection-tracker:${GITHUB_SHA::7}" services/collection-tracker/app
          podman push ghcr.io/hunternuga/collection-tracker:latest
          podman push "ghcr.io/hunternuga/collection-tracker:${GITHUB_SHA::7}"

      # Copies whichever tfvars already exist on the runner — a service
      # without secrets yet (e.g. collection-tracker, pre-deploy) just fails
      # its own terraform step later instead of blocking every other
      # service's deploy here.
      - name: Restore secrets
        run: |
          for svc in cloudflared collection-tracker minepanel; do
            if [ -f ~/.homelab-secrets/$svc.tfvars ]; then
              cp ~/.homelab-secrets/$svc.tfvars services/$svc/terraform.tfvars
            fi
          done

      - name: Deploy
        run: ./deploy.sh
