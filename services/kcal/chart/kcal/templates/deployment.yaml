{{- if and (not .Values.sessionSecret) (not .Values.existingSecret) }}
{{- fail "Set either .Values.sessionSecret or .Values.existingSecret" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kcal.fullname" . }}
  labels:
    {{- include "kcal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kcal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kcal.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kcal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: "/data/kcal.db"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kcal.secretName" . }}
                  key: session-secret
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kcal.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
